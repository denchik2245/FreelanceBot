services:
  bot:
    build: .
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    volumes:
      - ./data:/app/data
      - ./config:/app/config
      - ./src:/app/src:ro
    environment:
      PYTHONPATH: /app/src
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
